<div class="experience" #experienceElement>
  <div class="experience-content">
    <h1>Work Experience</h1>
    <hr />
    <div class="experience-grid">
      <!-- Sequential job entries -->
      <div class="job-entry" *ngFor="let experience of experiences">
        <h3 class="job-title">{{ experience.name }}</h3>
        <p class="company-duration">
          {{ experience.company }} <span>({{ experience.duration }})</span>
        </p>
        <ul class="achievements">
          <li *ngFor="let achievement of experience.items">{{ achievement }}</li>
        </ul>
      </div>
    </div>
  </div>
</div>
